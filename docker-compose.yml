# Local infrastructure for development: Postgres + Redis only.
# The apps run on the host with `pnpm dev`. For a production-like stack use docker-compose.full.yml.
# Host ports default to 5442/6390 to avoid clashing with other local Postgres/Redis instances.
name: anytools

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: anytools
      POSTGRES_PASSWORD: anytools
      POSTGRES_DB: anytools
    ports:
      - "${POSTGRES_HOST_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the `anytools_test` database used by the API test suite.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anytools -d anytools"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ requires `noeviction`; AOF keeps queues and unlock tokens across restarts.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_HOST_PORT:-6390}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
