# Production stack for Coolify ("Docker Compose" resource). Step-by-step guide: docs/deploy-coolify.md
#
# - Images come from GHCR (published by CI on every push to main).
# - Only the `proxy` service gets a domain in Coolify (https://anytools.josemorillo.dev): it routes
#   `/api/*` to the API and everything else to the web, exactly like docker-compose.full.yml.
# - Secrets use Coolify magic variables (SERVICE_PASSWORD_*): generated once and kept across deploys.
# - `${VAR:?}` must be filled in Coolify's Environment Variables before the first deploy.
# - `content:` and `exclude_from_hc` are Coolify extensions; use docker-compose.full.yml locally.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: anytools
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: anytools
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anytools -d anytools"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ requires `noeviction`; AOF keeps queues and unlock tokens across restarts.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot on every deploy: apply migrations, then upsert the catalog from the seed files.
  migrate:
    image: ${IMAGE_PREFIX:-ghcr.io/jant7070/anytools}-api:${IMAGE_TAG:-latest}
    pull_policy: always
    command:
      [
        "sh",
        "-c",
        "node node_modules/@anytools/db/dist/migrate.js && node node_modules/@anytools/db/dist/seed.js",
      ]
    environment:
      DATABASE_URL: postgres://anytools:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/anytools
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    exclude_from_hc: true

  api:
    image: ${IMAGE_PREFIX:-ghcr.io/jant7070/anytools}-api:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://anytools:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/anytools
      REDIS_URL: redis://redis:6379
      COOKIE_SECRET: ${SERVICE_PASSWORD_64_COOKIE}
      UNLOCK_JWT_SECRET: ${SERVICE_PASSWORD_64_UNLOCKJWT}
      IP_HASH_SALT: ${SERVICE_PASSWORD_IPSALT}
      FILE_SIGNING_SECRET: ${SERVICE_PASSWORD_64_FILESIGNING}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /data/storage
      # Cloudflare → Coolify Traefik → Caddy → API.
      TRUST_PROXY: ${TRUST_PROXY:-2}
      # Requires the origin to accept traffic ONLY from Cloudflare (see docs/deploy-coolify.md).
      TRUST_CLOUDFLARE_HEADERS: ${TRUST_CLOUDFLARE_HEADERS:-true}
      # All seeded tools are drafts for now; set to false once tools are published.
      SHOW_DRAFT_TOOLS: ${SHOW_DRAFT_TOOLS:-true}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?}
      AD_PROVIDER: ${AD_PROVIDER:?}
      ALLOW_DEV_AD_PROVIDER: ${ALLOW_DEV_AD_PROVIDER:-false}
      MONETAG_ZONE_ID: ${MONETAG_ZONE_ID:-}
      MONETAG_SDK_URL: ${MONETAG_SDK_URL:-}
      MONETAG_MIN_SECONDS: ${MONETAG_MIN_SECONDS:-20}
      APPLIXIR_API_KEY: ${APPLIXIR_API_KEY:-}
      APPLIXIR_GAME_ID: ${APPLIXIR_GAME_ID:-}
      APPLIXIR_SECRET: ${APPLIXIR_SECRET:-}
      UNLOCK_MAX_PER_IP_PER_DAY: ${UNLOCK_MAX_PER_IP_PER_DAY:-300}
    volumes:
      - storage:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    image: ${IMAGE_PREFIX:-ghcr.io/jant7070/anytools}-worker:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://anytools:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/anytools
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /data/storage
      FILE_SIGNING_SECRET: ${SERVICE_PASSWORD_64_FILESIGNING}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    volumes:
      - storage:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/jant7070/anytools}-web:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      SITE_URL: ${SITE_URL:-https://anytools.josemorillo.dev}
      API_INTERNAL_URL: http://api:4000
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?}
      POSTHOG_KEY: ${POSTHOG_KEY:-}
      CLARITY_PROJECT_ID: ${CLARITY_PROJECT_ID:-}
    depends_on:
      api:
        condition: service_healthy

  # Public entry point: assign the domain to this service in Coolify.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        content: |
          {
          	servers {
          		trusted_proxies static private_ranges
          	}
          }

          :80 {
          	encode zstd gzip

          	handle /api/* {
          		reverse_proxy api:4000
          	}

          	handle {
          		reverse_proxy web:3000
          	}
          }
      - caddydata:/data
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  storage:
  caddydata:
